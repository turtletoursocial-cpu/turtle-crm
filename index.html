<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Customer Communications Guideline</title>
    <style>
        :root { --t-green: #1a3a1a; --t-gold: #b08d57; --t-light: #fdfdfb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f1ed; display: flex; justify-content: center; padding: 20px; color: #2c2c2c; }
        .container { background: white; padding: 40px; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 750px; border-top: 6px solid var(--t-green); }
        .header { text-align: center; margin-bottom: 35px; border-bottom: 1px solid #eee; padding-bottom: 25px; }
        .logo { max-width: 180px; margin-bottom: 15px; }
        h2 { text-transform: uppercase; letter-spacing: 3px; font-weight: 300; font-size: 14px; color: var(--t-green); margin: 0; }
        .key-input { width: 100%; padding: 12px; margin-bottom: 25px; border: 1px solid #e0e0e0; border-radius: 0; font-size: 11px; background: var(--t-light); color: #888; text-align: center; }
        textarea { width: 100%; height: 220px; padding: 20px; border: 1px solid #d1d1d1; border-radius: 0; box-sizing: border-box; font-size: 15px; margin-bottom: 20px; line-height: 1.6; background: #fff; }
        button { background: var(--t-green); color: white; padding: 18px; border: none; cursor: pointer; width: 100%; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; transition: all 0.4s ease; }
        button:hover { background: #2a5a2a; box-shadow: 0 5px 15px rgba(26,58,26,0.2); }
        #output { margin-top: 35px; padding: 30px; border: 1px solid #eef0eb; background: var(--t-light); display: none; position: relative; font-size: 15px; line-height: 1.8; color: #333; }
        .copy-btn { position: absolute; top: 15px; right: 15px; font-size: 10px; background: var(--t-gold); color: white; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .status { font-size: 11px; color: #999; margin-top: 15px; text-align: center; font-style: italic; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://turtletourrome.com/wp-content/uploads/2021/03/Turtle-tour-Logo-ok.png" alt="Turtle Tour Rome" class="logo">
        <h2>CRM Customer Communications Guideline</h2>
    </div>
    <input type="password" id="apiKey" class="key-input" placeholder="ACCESS KEY REQUIRED" onchange="saveKey()">
    <textarea id="userInput" placeholder="Paste incoming guest message or inquiry here..."></textarea>
    <button onclick="generate()" id="mainBtn">Generate Draft Guideline</button>
    <div id="status" class="status"></div>
    <div id="output">
        <button onclick="copyText()" id="copyBtn" class="copy-btn">COPY DRAFT</button>
        <div id="responseText" style="white-space: pre-wrap;"></div>
    </div>
</div>

<script>
    window.onload = () => { 
        const savedKey = localStorage.getItem('t_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey.trim(); 
    };

    function saveKey() { 
        localStorage.setItem('t_key', document.getElementById('apiKey').value.trim()); 
    }

    async function generate() {
        const key = document.getElementById('apiKey').value.trim();
        const input = document.getElementById('userInput').value;
        const outBox = document.getElementById('output');
        const resDiv = document.getElementById('responseText');
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('status');

        if(!key || !input) return alert("System Key and Message Required.");

        btn.disabled = true;
        status.innerText = "Applying guideline logic and drafting...";
        outBox.style.display = "block";
        resDiv.innerText = "";

        const prompt = `Role: Luca, Customer Relationship Manager at Turtle Tour Rome.
Context: You are responding to customer inquiries for an eco-friendly golf cart tour company.

CRITICAL FORMATTING RULES:
- Use standard text paragraphs ONLY. Do not use overly long paragraphs.
- DO NOT use Markdown tables, headers (e.g., ###), bold text, horizontal lines, or bullet points. 
- If listing options, write "Option 1 -" and "Option 2 -" in plain text.

BUSINESS LOGIC & PROBLEM-SOLVING RULES (Apply the relevant ones based on the inquiry):
1. Out-of-Zone Hotel Pickups: If a hotel is outside the allowed zone, do NOT accept extra fees. Instead, propose a nearby, safe meeting point just outside the restricted traffic flow (e.g., a nearby store or landmark).
2. Holding Reservations: Do NOT hold or "mark down" slots without a booking. Explain we operate on a "just-in-time availability system" with high demand. Urge them to book immediately online to secure the slot.
3. Customizing Short Tours (1.5 hours): Warn that the 1.5-hour tour is carefully curated. Adding custom stops (e.g., specific photos) means dropping standard stops due to time limits. Tell them to put specific requests in the "Notes" section when booking online.
4. Last-Minute Date Changes (Under 48 hours): Acknowledge the 48-hour cancellation policy applies, but offer grace. Offer Option 1: Move the tour for a €30 change fee. Option 2: Upgrade to an alternative available tour (like the Night Tour) for the price difference.
5. Empathy & Tone: Be polite, empathetic ("these things happen"), and accommodating, but remain firm on company policies.

SIGN-OFF FORMAT:
Warm regards,
Turtle Tour Team
Customer Relationship Manager
TURTLE TOUR ROME`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": "Bearer " + key, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "openai/gpt-oss-120b",
                    messages: [
                        { role: "system", content: prompt }, 
                        { role: "user", content: input }
                    ],
                    temperature: 0.1
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `Server Error (${response.status})`);
            }

            resDiv.innerText = data.choices[0].message.content.trim();
            status.innerText = "Guideline generated.";
        } catch (e) {
            resDiv.innerText = "Error: " + e.message;
            status.innerText = "Execution failed.";
        } finally { 
            btn.disabled = false; 
        }
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('responseText').innerText);
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "COPIED";
        setTimeout(() => { copyBtn.innerText = "COPY DRAFT"; }, 2000);
    }
</script>
</body>
</html>
