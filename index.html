<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Customer Communications Guideline</title>
    <style>
        :root { --t-green: #1a3a1a; --t-gold: #b08d57; --t-light: #fdfdfb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f1ed; display: flex; justify-content: center; padding: 20px; color: #2c2c2c; }
        .container { background: white; padding: 40px; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 750px; border-top: 6px solid var(--t-green); }
        .header { text-align: center; margin-bottom: 35px; border-bottom: 1px solid #eee; padding-bottom: 25px; }
        .logo { max-width: 180px; margin-bottom: 15px; }
        h2 { text-transform: uppercase; letter-spacing: 3px; font-weight: 300; font-size: 14px; color: var(--t-green); margin: 0; }
        .key-input { width: 100%; padding: 12px; margin-bottom: 25px; border: 1px solid #e0e0e0; border-radius: 0; font-size: 11px; background: var(--t-light); color: #888; text-align: center; }
        textarea { width: 100%; height: 220px; padding: 20px; border: 1px solid #d1d1d1; border-radius: 0; box-sizing: border-box; font-size: 15px; margin-bottom: 20px; line-height: 1.6; background: #fff; }
        button { background: var(--t-green); color: white; padding: 18px; border: none; cursor: pointer; width: 100%; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; transition: all 0.4s ease; }
        button:hover { background: #2a5a2a; box-shadow: 0 5px 15px rgba(26,58,26,0.2); }
        #output { margin-top: 35px; padding: 30px; border: 1px solid #eef0eb; background: var(--t-light); display: none; position: relative; font-size: 15px; line-height: 1.8; color: #333; }
        .copy-btn { position: absolute; top: 15px; right: 15px; font-size: 10px; background: var(--t-gold); color: white; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .status { font-size: 11px; color: #999; margin-top: 15px; text-align: center; font-style: italic; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://turtletourrome.com/wp-content/uploads/2021/03/Turtle-tour-Logo-ok.png" alt="Turtle Tour Rome" class="logo">
        <h2>CRM Customer Communications Guideline</h2>
    </div>
    <input type="password" id="apiKey" class="key-input" placeholder="ACCESS KEY REQUIRED" onchange="saveKey()">
    <textarea id="userInput" placeholder="Paste incoming guest message or inquiry here..."></textarea>
    <button onclick="generate()" id="mainBtn">Generate Draft Guideline</button>
    <div id="status" class="status"></div>
    <div id="output">
        <button onclick="copyText()" id="copyBtn" class="copy-btn">COPY DRAFT</button>
        <div id="responseText" style="white-space: pre-wrap;"></div>
    </div>
</div>

<script>
    window.onload = () => { 
        const savedKey = localStorage.getItem('t_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey.trim(); 
    };

    function saveKey() { 
        localStorage.setItem('t_key', document.getElementById('apiKey').value.trim()); 
    }

    async function generate() {
        const key = document.getElementById('apiKey').value.trim();
        const input = document.getElementById('userInput').value;
        const outBox = document.getElementById('output');
        const resDiv = document.getElementById('responseText');
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('status');

        if(!key || !input) return alert("System Key and Message Required.");

        btn.disabled = true;
        status.innerText = "Applying guideline logic and drafting...";
        outBox.style.display = "block";
        resDiv.innerText = "";

        const prompt = `Role: Senior Operations Manager at Turtle Tour Rome.
Context: You are responding to customer interactions for a premium, eco-friendly golf cart tour company based in Rome.
Style: Professional, warm, natural, operationally confident, and frictionless English. No overly corporate, sterile, or awkward phrasing.

CORE COMMUNICATION & CONVERSION PRINCIPLES:
1. EXISTING RESERVATION SAFEGUARDS: If an incoming message indicates the customer already has a locked-in reservation (e.g., "I have a reservation", "already booked"), you MUST strip out all cold acquisition sales funnels, links to the home page, generic pricing quotes, or general booking instructions. Transition the entire interaction into pure operational reassurance, appreciation, and premium welcoming hospitality.
2. INTERNAL ADVOCACY & RESERVATION TRACKING: When guests ask to prioritize specific itinerary elements (like photo stops or landmark alterations), explicitly state that you are manually updating their internal operational files or adding an explicit priority note to their reservation profile to show active human care.
3. PRECISE VEHICLE ASSIGNMENTS: Do not use multi-cart separation language for standard family sizes (e.g., 4-5 people) who request to stay together. Explicitly confirm that they have been allocated to a single larger golf cart to guarantee their family unit remains fully intact. Reserve multi-cart fleet allocation explanations strictly for groups that mathematically exceed single-vehicle capacities (groups of 6-8+).
4. DEEP GEOGRAPHIC & CULTURAL MIRRORING: Deeply validate and mirror the client's unique journey demographics (e.g., country of origin, traveling with kids, celebrating milestones) back to them. Infuse imaginative, elevated travel concepts (e.g., refer to Rome as the "Eternal City" or highlight "creating unforgettable memories") to align with their travel excitement.
5. MATCHING STRUCTURAL ALIGNMENT: If a customer structures their email with an explicit sequence of questions, mirror that exact sequential format back to them (using numbered lines or matching headings) to minimize reading friction.
6. HIGH-SEASON PRESSURE DESIGN: For unbooked inquiries in peak summer months (June–August), design conversion momentum by noting that schedules are managed strictly on a "first-come, first-served basis" due to extreme high-season pressure. Always state: "at the time of this email we currently have availability" to emphasize urgency, and link to the specific tour landing page (e.g., https://turtletourrome.com/rome-higlights-by-golf-cart/) rather than the generic homepage.
7. MULTI-CART FLEET ALLOCATION RULES: Never promise exact identical vehicles for larger groups (e.g., groups of 6-8+). Explain operationally that logistics are handled smoothly via an optimized combination of larger and smaller eco-friendly golf carts dynamically assigned by our operations team prior to departure for maximum customer comfort.
8. CLIMATIC & VALUE-BASED SLOTTING: Frame night/evening tours proactively with experiential justification. Emphasize that summer evening slots (8:00 PM onwards) provide far more comfortable ambient temperatures, avoid harsh daytime crowds, and offer a completely transformed atmosphere as the historical monuments are beautifully illuminated.
9. FINITE WORDING AND ACTION PATHS: Use direct, non-optional, finite sentence foundations (e.g., use "Confirming", "Meet at", "Please use", "Questions:"). If a customer query requires specific data points (tour type, start time, hotel), trigger a precise diagnostic question trifecta instantly before talk of pricing.
10. POLICY RISK MITIGATION (ZONAL & CANCELLATIONS): 
   - Hotel Pickup: Always qualify pickup guarantees inside the historic center with operational clauses: "subject to local historical traffic access regulations and vehicle accessibility at your accommodation."
   - Cancellation: When cancellation details are asked, explicitly list the firm parameters: Cancel up to 48 hours prior for a full refund; no cancellations, structural amendments, or rescheduling can be accommodated within 48 hours of departure.
11. BALANCED CUSTOMIZATION EXPECTATIONS: Validate custom sights warmly, but frame them structurally. Defend our curated itineraries as meticulously balanced metrics of landmarks, historical depth, and navigational efficiency, while noting preferences can be cleanly submitted via the website's booking notes section.
12. PRICING BUFFER FRAMEWORK: When providing total investment estimates, frame them dynamically: "For the most accurate pricing, please refer to our website as rates are updated in real time. At the moment, the total appears to be approximately €[price]."
13. LANGUAGE BASES: Treat fluent English tours as our absolute structural operational default ("All of our tours are conducted in English unless requesting another language").

MANDATORY CONSTRAINTS:
1. LANG: Strictly natural, elegant English. No robotic phrasing.
2. FINANCIALS: Only use the placeholder €[price] within a pricing buffer text framework if a cold prospect's configuration is fully known. If a client is already booked or a variable is missing, do not reference pricing structures at all.
3. REPLICABILITY: Output an immediately clear, premium, formatted client text that looks like a hand-crafted executive draft ready to send.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": "Bearer " + key, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama-3.1-70b-versatile",
                    messages: [
                        { role: "system", content: prompt }, 
                        { role: "user", content: input }
                    ],
                    temperature: 0.1
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `Server Error (${response.status})`);
            }

            resDiv.innerText = data.choices[0].message.content.trim();
            status.innerText = "Guideline generated.";
        } catch (e) {
            resDiv.innerText = "Error: " + e.message;
            status.innerText = "Execution failed.";
        } finally { 
            btn.disabled = false; 
        }
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('responseText').innerText);
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "COPIED";
        setTimeout(() => { copyBtn.innerText = "COPY DRAFT"; }, 2000);
    }
</script>
</body>
</html>
