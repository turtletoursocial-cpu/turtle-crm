<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle CRM | Operations Desk</title>
    <style>
        :root { --turtle-green: #2d5a27; --turtle-light: #f4f7f4; --turtle-gold: #c5a059; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--turtle-light); margin: 0; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 800px; border-top: 8px solid var(--turtle-green); }
        h1 { color: var(--turtle-green); margin-top: 0; }
        .setup-section { background: #fff9e6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffeeba; }
        .setup-section label { font-size: 14px; color: #555; }
        input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { width: 100%; height: 150px; padding: 15px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; resize: vertical; }
        button { background-color: var(--turtle-green); color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #1e3e1a; }
        #output { margin-top: 25px; padding: 20px; background: #f9f9f9; border-left: 5px solid var(--turtle-gold); white-space: pre-wrap; display: none; position: relative; font-size: 15px; line-height: 1.6; color: #333; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: var(--turtle-gold); border: none; padding: 5px 15px; color: white; border-radius: 4px; cursor: pointer; font-size: 14px; width: auto; }
        .copy-btn:hover { background: #a88544; }
        .status { text-align: center; margin-top: 10px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐢 Turtle CRM Desk</h1>
    
    <div class="setup-section">
        <label><strong>Staff Setup:</strong> Enter Groq API Key (Starts with gsk_)</label>
        <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">
    </div>

    <label><strong>Customer Email/Message:</strong></label>
    <textarea id="userInput" placeholder="Paste the customer's exact message here..."></textarea>
    
    <button onclick="generateResponse()" id="generateBtn">Draft Professional Reply</button>
    <div id="statusText" class="status"></div>

    <div id="output">
        <button class="copy-btn" onclick="copyText()">Copy Draft</button>
        <div id="responseText"></div>
    </div>
</div>

<script>
    // Auto-load saved key on refresh
    window.onload = function() {
        const savedKey = localStorage.getItem('turtle_groq_key');
        if (savedKey) { document.getElementById('apiKey').value = savedKey; }
    }

    function saveKey() {
        const key = document.getElementById('apiKey').value;
        localStorage.setItem('turtle_groq_key', key);
    }

    async function generateResponse() {
        const key = document.getElementById('apiKey').value.trim();
        const input = document.getElementById('userInput').value.trim();
        const responseDiv = document.getElementById('responseText');
        const output = document.getElementById('output');
        const statusText = document.getElementById('statusText');
        const btn = document.getElementById('generateBtn');

        if (!key) {
            alert("Please paste your Groq API key at the top first.");
            return;
        }
        if (!input) {
            alert("Please paste a customer message to reply to.");
            return;
        }

        // Save key for convenience
        localStorage.setItem('turtle_groq_key', key);
        
        // UI updates during loading
        output.style.display = "block";
        responseDiv.innerText = "";
        statusText.innerText = "Drafting response...";
        btn.disabled = true;
        btn.style.backgroundColor = "#888";

        // The "Brain" - Updated for sophisticated English and strict rules
        const systemInstruction = `You are the Senior Head of Operations for Turtle Tour Social in Rome. 

Communication Style: You speak and write in flawless, sophisticated English. Your tone is warm and professional. You must NEVER use Italian words or phrases (no Ciao, no Buongiorno, etc.). Focus on elegant, clear, and highly articulate English.

CORE OPERATIONAL RULES:
1. Immediate Empathy: If a guest mentions an injury, fall, illness, or stress, the very first sentence must acknowledge their wellbeing with genuine care and sophistication.
2. Refined Refusals: Never use a flat "No." Reframe refusals gracefully ("While our standard route does not extend to that area...").
3. Hilton Rome EUR Policy: This hotel is STRICTLY Out of Zone. Explain that due to the distance, hotel pickup is not feasible for the golf carts. Suggest they take a Taxi to "Piazza Mattei", describing it as a convenient meeting point.
4. Price Protection: You must NEVER generate a specific price number. ALWAYS use the exact placeholder €[price] so the office staff can fill it in manually.
5. Closure: End every message with a professional call to action.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-70b-8192", // Fast, reliable Groq model
                    messages: [
                        { role: "system", content: systemInstruction },
                        { role: "user", content: input }
                    ],
                    temperature: 0.3 // Keeps the AI focused and strict on rules
                })
            });

            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }

            const data = await response.json();
            responseDiv.innerText = data.choices[0].message.content.trim();
            statusText.innerText = "Draft ready!";
            
        } catch (error) {
            console.error(error);
            responseDiv.innerText = "Connection Error: Please verify your Groq API key is correct and active.";
            statusText.innerText = "Drafting failed.";
        } finally {
            // Restore button
            btn.disabled = false;
            btn.style.backgroundColor = "var(--turtle-green)";
        }
    }

    function copyText() {
        const textToCopy = document.getElementById('responseText').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = "Copied!";
            setTimeout(() => copyBtn.innerText = "Copy Draft", 2000);
        });
    }
</script>
</body>
</html>
