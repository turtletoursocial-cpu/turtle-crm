<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle CRM | Operations Desk</title>
    <style>
        :root { --t-green: #1a3a1a; --t-gold: #b08d57; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f4f2; display: flex; justify-content: center; padding: 40px; color: #212529; }
        .container { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 700px; border-top: 5px solid var(--t-green); }
        h2 { text-transform: uppercase; letter-spacing: 2px; font-weight: 500; font-size: 16px; margin-bottom: 25px; color: var(--t-green); border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .key-section { margin-bottom: 20px; }
        .key-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 2px; font-size: 12px; background: #fafafa; }
        textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid #ccc; border-radius: 2px; box-sizing: border-box; font-size: 15px; margin-bottom: 20px; line-height: 1.6; font-family: inherit; }
        button { background: var(--t-green); color: white; padding: 16px; border: none; cursor: pointer; width: 100%; text-transform: uppercase; font-weight: 600; letter-spacing: 1.5px; transition: 0.3s; }
        button:hover { background: #2a5a2a; }
        #output { margin-top: 30px; padding: 25px; border: 1px solid #e0e0e0; background: #fdfdfd; display: none; position: relative; font-size: 15px; line-height: 1.7; color: #333; }
        .copy-btn { position: absolute; top: 10px; right: 10px; font-size: 11px; background: var(--t-gold); color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 2px; }
        .status { font-size: 12px; color: #888; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Operations Communication Desk</h2>
    
    <div class="key-section">
        <input type="password" id="apiKey" class="key-input" placeholder="Enter System API Key (gsk_...)" onchange="saveKey()">
    </div>

    <textarea id="userInput" placeholder="Paste incoming guest message/correspondence here..."></textarea>
    
    <button onclick="generate()" id="mainBtn">Generate Formal Draft</button>
    <div id="status" class="status"></div>

    <div id="output">
        <button onclick="copyText()" id="copyBtn" class="copy-btn">COPY DRAFT</button>
        <div id="responseText"></div>
    </div>
</div>

<script>
    // Load key on startup
    window.onload = () => { 
        const savedKey = localStorage.getItem('t_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey; 
    };

    function saveKey() {
        localStorage.setItem('t_key', document.getElementById('apiKey').value);
    }

    async function generate() {
        const key = document.getElementById('apiKey').value;
        const input = document.getElementById('userInput').value;
        const outBox = document.getElementById('output');
        const resDiv = document.getElementById('responseText');
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('status');

        if(!key || !input) return alert("System Key and Message Required.");

        btn.disabled = true;
        status.innerText = "Drafting professional response...";
        outBox.style.display = "block";
        resDiv.innerText = "";

        const prompt = `Role: Senior Operations Manager at Turtle Tour Social.
Tone: Formal, Concise, Executive. British/International Business English.

MANDATORY CONSTRAINTS:
- EMOTION: Limit sympathy to one short formal sentence (e.g., "We are sorry to hear of the situation.") No "don't worry about a thing" or overly personal language.
- NO ITALIAN: Zero Italian words (No Ciao, Buongiorno, etc.).
- NO NUMBERS: Prohibited from including prices. Use the placeholder: €[price].
- HILTON EUR POLICY: Decline hotel pickup. Direct guest to take a taxi to Piazza Mattei.
- STYLE: Professional and direct. No chatty fillers.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role:"system", content: prompt}, {role:"user", content: input}],
                    temperature: 0.0
                })
            });
            const data = await response.json();
            resDiv.innerText = data.choices[0].message.content.trim();
            status.innerText = "";
        } catch (e) {
            resDiv.innerText = "Connection Error. Check API Key.";
            status.innerText = "";
        } finally {
            btn.disabled = false;
        }
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('responseText').innerText);
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "COPIED";
        setTimeout(() => { copyBtn.innerText = "COPY DRAFT"; }, 2000);
    }
</script>
</body>
</html>
